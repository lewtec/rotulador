[tools]
go = "1.26.5"
golangci-lint = "2.8.0"
node = "24"
goreleaser = "2.17.0"
svu = "3.3.0"

[tasks.gen]
description = "go generate ./... (CSS, sqlc, templ, goi18n)"
run = "go generate ./..."

[tasks.lint]
description = "Run linters"
run = "golangci-lint run"

[tasks.ci]
description = "Run CI checks (gen + lint + test + build)"
depends = ["gen", "lint", "test"]
run = "go build -v ./cmd/rotulador"

[tasks.test]
description = "Run all tests with coverage"
depends = ["gen"]
run = """
go test -v -race -coverprofile=coverage.out ./...
go tool cover -html=coverage.out -o coverage.html
echo "✓ Coverage report generated: coverage.html"
"""

[tasks."test-short"]
description = "Run short tests (no integration tests)"
depends = ["gen"]
run = "go test -short -v ./..."

[tasks.build]
description = "Build the binary"
run = "go build -v -o rotulador ./cmd/rotulador"

[tasks.clean]
description = "Clean build artifacts"
run = """
rm -rf rotulador coverage.out coverage.html dist/
echo "✓ Cleaned"
"""

[tasks."release:check"]
description = "Validate .goreleaser.yaml"
run = "goreleaser check"

[tasks.release]
description = "Tag with svu and publish binaries + GHCR image via GoReleaser"
depends = ["ci"]
usage = '''
arg "<version>" help="New version" {
  choices "next" "major" "minor" "patch"
  default "next"
}
'''
run = '''
TAG="$(svu ${usage_version})"
echo "Releasing tag: $TAG (svu current=$(svu current 2>/dev/null || echo none))"
if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
  echo "Tag $TAG already exists" >&2
  exit 1
fi
# Local tag only until GoReleaser succeeds; version is stamped via ldflags.
git tag "$TAG"
if ! goreleaser release --clean; then
  git tag -d "$TAG"
  exit 1
fi
git push origin "refs/tags/$TAG"
'''
