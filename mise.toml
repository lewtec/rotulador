[tools]
go = "1.25.5"
golangci-lint = "2.8.0"
node = "24"

[tasks.gen]
description = "go generate ./... (CSS, sqlc, goi18n)"
run = "go generate ./..."

[tasks.lint]
description = "Run linters"
run = "golangci-lint run"

[tasks.ci]
description = "Run CI checks (gen + lint + test + build)"
depends = ["gen", "lint", "test"]
run = "go build -v ./cmd/rotulador"

[tasks.test]
description = "Run all tests with coverage"
depends = ["gen"]
run = """
go test -v -race -coverprofile=coverage.out ./...
go tool cover -html=coverage.out -o coverage.html
echo "✓ Coverage report generated: coverage.html"
"""

[tasks."test-short"]
description = "Run short tests (no integration tests)"
depends = ["gen"]
run = "go test -short -v ./..."

[tasks.build]
description = "Build the binary"
run = "go build -v -o rotulador ./cmd/rotulador"

[tasks.clean]
description = "Clean build artifacts"
run = """
rm -f rotulador coverage.out coverage.html
echo "✓ Cleaned"
"""
